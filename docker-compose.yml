services:
  dashboard:
    build: .
    container_name: live_dashboard
    restart: unless-stopped
    # Config/tokens live in the repo-root .env; inject them straight into the
    # container instead of repeating every key here. Infra constants (PORT,
    # STATIC_DIR, DB_PATH) stay literal in `environment` because they pin the
    # layout inside the container (DB_PATH must point into the /data volume).
    env_file:
      - path: .env
        required: true
    environment:
      - PORT=3000
      - STATIC_DIR=/app/public
      - DB_PATH=/data/live-dashboard.db
    volumes:
      - dashboard_data:/data
    networks:
      dm_network:
        ipv4_address: 172.20.0.80
    mem_limit: 128m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  dashboard_data:

networks:
  dm_network:
    external: true
    name: your_external_network  # Replace with your Docker network name
